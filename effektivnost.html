<script>
// Источник — страница maramuhta. Сюда дописываются только классы Мясницкой.
const SRC = 'https://maramuhta.github.io/yogaspace/effektivnost-prepodavateley/';
const ATT = 'https://maramuhta.github.io/analitikaprepodavately/';
(async () => {
  try {
    const r = await fetch(SRC + '?t=' + Date.now(), {cache: 'no-store'});
    if (!r.ok) throw new Error('src ' + r.status);
    let h = await r.text();
    const MARK = 'const STUDIOS = ';
    if (!h.includes('const CITY_TEACHERS = ') || !h.includes(MARK)) throw new Error('format');
    const ms = JSON.parse(document.getElementById('ms-data').textContent);
    // 1) классы Мясницкой — в общий список (к преподавателю, если он уже есть в других студиях)
    const patch = '\n;(function(){ try { const MS = ' + JSON.stringify(ms).replace(/</g, '\\u003c') + ';\n'
      + 'const list = CITY_TEACHERS.moscow; MS.forEach(t => { const ex = list.find(x => x.name === t.name);\n'
      + 'if (ex) { ex.studios = ex.studios.filter(s => s.studio !== "Мясницкая").concat(t.studios); } else list.push(t); });\n'
      + '} catch(e) { console.warn("Мясницкая не добавлена", e); } })();\n';
    h = h.replace(MARK, () => patch + MARK);
    // 2) отчёт «Посещаемость» во вкладке студии — копией с того же адреса, что и страница (иначе браузер не даст его настроить)
    h = h.replace('id="attFrame" src="${ATT_URL}"', 'id="attFrame" data-ys-att="1"');
    const shim = '<base href="' + SRC + '"><script>(function(){ let cache = null;'
      + 'async function fill(f){ f.dataset.ysAtt = "2"; try { if (!cache) { const r = await fetch("' + ATT + '?t=" + Date.now(), {cache:"no-store"}); cache = await r.text(); }'
      + ' const html = cache.replace(/<head[^>]*>/i, m => m + \'<base href="' + ATT + '">\'); f.srcdoc = html; } catch(e) { f.src = "' + ATT + '"; } }'
      + 'new MutationObserver(() => document.querySelectorAll(\'iframe[data-ys-att="1"]\').forEach(fill))'
      + '.observe(document.documentElement, {childList:true, subtree:true}); })();<\/script>';
    h = h.replace(/<head[^>]*>/i, m => m + shim);
    document.open(); document.write(h); document.close();
  } catch (e) {
    console.warn(e);
    location.replace(SRC);   // что-то пошло не так — показываем оригинальную страницу как есть
  }
})();
</script>
